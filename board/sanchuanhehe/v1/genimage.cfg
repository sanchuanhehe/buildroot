image disk.img {
    hdimage {
        partition-table-type = "msdos"
    }
    
    partition boot {
        bootable = "true"
        image = "boot.fat32"
        partition-type = 0x83
        size = "100M"
    }
}

image boot.fat32 {
    ext2 {
        label = "boot"
        files = {
            "bzImage",
            "rootfs.cpio"
        }
    }
    size = "100M"
}