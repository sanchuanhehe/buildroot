image disk.img {
    hdimage {
        partition-table-type = "mbr"
    }
    
    partition boot {
        bootable = "true"
        image = "boot.fat32"
        partition-type = 0x83
        size = "100M"
    }
}

image boot.fat32 {
    vfat {
        label = "boot"
        file bzImage {
            image = "bzImage"
        }
        file rootfs.cpio {
            image = "rootfs.cpio"
        }
    }
    size = "100M"
}