image disk.img {
    hdimage {
        partition-table-type = "mbr"
    }

    partition boot {
        bootable = "true"
        image = "boot.fat32"
        partition-type = 0xEF
        size = "100M"
    }
}

image boot.fat32 {
    vfat {
        label = "boot"

        file bzImage {
            image = "bzImage"
        }

        file rootfs.cpio {
            image = "rootfs.cpio"
        }

        file EFI/BOOT/BOOTX64.EFI {
            image = "efi-part/EFI/BOOT/bootx64.efi"
        }

        file EFI/BOOT/grub.cfg {
            image = "efi-part/EFI/BOOT/grub.cfg"
        }
    }
    size = "100M"
}
